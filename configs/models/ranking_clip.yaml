run_name: rank_clip_v1
kind: ranking
seed: 42
manifest_path: data/processed/image_manifest.parquet
labels_path: data/processed/aggregated_labels.parquet
features_path: data/processed/features/features_v1.parquet
output_dir: data/artifacts
# Pairwise logistic regression on CLIP embedding differences. Pairs: explicit duels plus
# pseudo-pairs from scalar labels (score gap >= 2). Once enough duels exist, set
# pair_sources: [explicit] to train on the top-end duels only.
embedding_models:
  - clip_vit_b32
include_features: false
pair_sources:
  - explicit
  - pseudo_from_scores
max_train_pairs: 20000
C: 0.5
