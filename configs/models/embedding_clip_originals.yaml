run_name: embed_clip_originals_v1
kind: embedding
seed: 42
manifest_path: data/processed/image_manifest.parquet
labels_path: data/processed/aggregated_labels.parquet
features_path: data/processed/features/features_v1.parquet
output_dir: data/artifacts
target_column: mean_score
cross_validate: true
# Train and evaluate on full photos only, so the crop-vs-original confound cannot carry the score.
include_kinds:
  - original
embedding_models:
  - clip_vit_b32
include_features: false
include_zero_shot: false
knn_neighbors: 8
regressors:
  - ridge
  - svr
