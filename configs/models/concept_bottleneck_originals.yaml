run_name: concept_bottleneck_originals_v1
kind: concept
seed: 42
manifest_path: data/processed/image_manifest.parquet
labels_path: data/processed/aggregated_labels.parquet
features_path: data/processed/features/features_v1.parquet
output_dir: data/artifacts
target_column: mean_score
cross_validate: true
# Full photos only: the scene-fraction confound cannot carry the score here.
include_kinds:
  - original
# With ~120 labeled originals the wide vocabulary overfits (OOF rho 0.11); the 16 CLIP concepts alone reach 0.41.
concept_families:
  - clip_concept
regressors:
  - lasso
inner_cv: 5
bootstrap_samples: 200
variants:
  nur_clip_konzepte: [clip_concept]
  clip_konzepte_und_licht: [clip_concept, clip_light]
  nur_judge: [judge_flag, judge_light, judge_type]
  nur_palette: [palette]
  alles: [clip_concept, clip_light, judge_flag, judge_light, palette]
